<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>資源循環機構 - Flow/Pressure MVP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">RESOURCE CIRCULATION AUTHORITY</p>
        <h1>資源循環機構</h1>
      </div>
      <section class="status-panel">
        <div class="status-item"><span>CORE</span><strong id="coreHp">100</strong></div>
        <div class="status-item"><span>FUEL</span><strong id="fuel">0.0</strong></div>
        <div class="status-item"><span>OIL</span><strong id="oilCount">0.0</strong></div>
      </section>
    </header>

    <section class="game-shell">
      <div class="instructions">
        <p>
          地盤をクリックして掘削。石油は<strong>圧力差＋重力</strong>で坑道内を流れます。
          精製機は一定流量まで処理できます。
        </p>
      </div>

      <div id="grid" class="grid"></div>

      <footer class="controls">
        <button id="restartBtn" type="button">再稼働</button>
        <span id="message">地盤を掘削して流路を設計してください。</span>
      </footer>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
